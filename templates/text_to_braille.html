{% extends "base.html" %}
{% block title %}Text to Braille - Braille World{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <!-- Navigation Buttons -->
        <div class="mb-4 d-flex gap-2 flex-wrap">
            <button onclick="history.back()" class="btn btn-outline-primary">
                <i class="fas fa-chevron-left me-2"></i>Back
            </button>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                <i class="fas fa-home me-2"></i>Back to Homepage
            </a>
        </div>
        
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h2 class="mb-0">
                            <i class="fas fa-keyboard me-2"></i>Text to Braille Converter
                        </h2>
                    </div>
                    
                    <div class="card-body p-4">
                        <!-- Input Section -->
                        <div class="mb-4">
                            <label for="textInput" class="form-label fw-bold">Enter Text:</label>
                            <div class="input-group">
                                <textarea 
                                    id="textInput" 
                                    class="form-control" 
                                    rows="4" 
                                    placeholder="Type your text here or use the microphone..."
                                    style="resize: vertical;"
                                ></textarea>
                                <button 
                                    id="micButton" 
                                    class="btn btn-outline-primary" 
                                    type="button"
                                    title="Click to start voice recognition"
                                >
                                    <i class="fas fa-microphone"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Controls -->
                        <div class="text-center mb-4">
                            <button id="convertBtn" class="btn btn-success btn-lg me-2">
                                <i class="fas fa-sync-alt me-2"></i>Convert to Braille
                            </button>
                            <button id="readAloudBtn" class="btn btn-outline-success btn-lg" disabled>
                                <i class="fas fa-volume-up me-2"></i>Read Aloud
                            </button>
                            <button id="clearBtn" class="btn btn-outline-danger btn-lg">
                                <i class="fas fa-trash me-2"></i>Clear
                            </button>
                        </div>
                        
                        <!-- Loading Spinner -->
                        <div id="loadingSpinner" class="text-center d-none mb-4">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Converting...</span>
                            </div>
                            <p class="mt-2 text-muted">Converting text to Braille...</p>
                        </div>

                        <!-- Braille Output -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Braille Output:</label>
                            <div id="brailleOutput" class="braille-display p-3 bg-light rounded border">
                                <span class="text-muted">Braille text will appear here...</span>
                            </div>
                        </div>
                        
                        <!-- Character Mapping -->
                        <div id="characterMapping" class="d-none">
                            <label class="form-label fw-bold">Character Mapping:</label>
                            <div id="mappingDisplay" class="mapping-display p-3 bg-light rounded border"></div>
                        </div>
                        
                        <!-- Error Display -->
                        <div id="errorDisplay" class="alert alert-danger d-none">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span id="errorMessage"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const textInput = document.getElementById('textInput');
    const micButton = document.getElementById('micButton');
    const convertBtn = document.getElementById('convertBtn');
    const readAloudBtn = document.getElementById('readAloudBtn');
    const clearBtn = document.getElementById('clearBtn');
    const brailleOutput = document.getElementById('brailleOutput');
    const characterMapping = document.getElementById('characterMapping');
    const mappingDisplay = document.getElementById('mappingDisplay');
    const errorDisplay = document.getElementById('errorDisplay');
    const errorMessage = document.getElementById('errorMessage');
    const loadingSpinner = document.getElementById('loadingSpinner');

    let recognition = null;

    // Mic button logic
    micButton.addEventListener('click', () => {
        if (typeof Android !== 'undefined' && Android.recordAndReturnText) {
            Android.recordAndReturnText();
            return;
        }

        if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
            alert('Voice recognition not supported in this browser.');
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            textInput.value = transcript;
        };
        recognition.onerror = () => alert('Voice recognition error');
        recognition.start();
    });

    // Convert button logic
    convertBtn.addEventListener('click', () => {
        const text = textInput.value.trim();
        if (!text) {
            showError('Please enter some text.');
            return;
        }

        loadingSpinner.classList.remove('d-none');
        fetch('/api/convert-text', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, language: 'english' })
        })
        .then(res => res.json())
        .then(data => {
            loadingSpinner.classList.add('d-none');
            if (data.braille_text) {
                brailleOutput.innerHTML = `<strong>${data.braille_text}</strong>`;
                mappingDisplay.innerHTML = '';
                [...data.original_text].forEach((char, i) => {
                    mappingDisplay.innerHTML += `<div class="d-inline-block text-center me-2">
                        <div>${data.braille_text[i]}</div>
                        <small>${char === ' ' ? '⎵' : char}</small>
                    </div>`;
                });
                characterMapping.classList.remove('d-none');
                readAloudBtn.disabled = false;
            } else {
                showError(data.error || 'Conversion failed.');
            }
        })
        .catch(() => {
            loadingSpinner.classList.add('d-none');
            showError('Server error. Please try again.');
        });
    });

    // Read aloud logic
    readAloudBtn.addEventListener('click', () => {
        const text = textInput.value.trim();
        if (!text) return;

        if (typeof Android !== 'undefined' && Android.speakText) {
            Android.speakText(text, 'en');
        } else {
            fetch('/api/text-to-speech', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text, language: 'english' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.audio_url) {
                    new Audio(data.audio_url).play();
                } else {
                    alert('TTS failed: ' + data.error);
                }
            });
        }
    });

    // Clear all
    clearBtn.addEventListener('click', () => {
        textInput.value = '';
        brailleOutput.innerHTML = '<span class="text-muted">Braille text will appear here...</span>';
        mappingDisplay.innerHTML = '';
        characterMapping.classList.add('d-none');
        readAloudBtn.disabled = true;
        errorDisplay.classList.add('d-none');
    });

    function showError(msg) {
        errorMessage.textContent = msg;
        errorDisplay.classList.remove('d-none');
    }
});
</script>
{% endblock %}
